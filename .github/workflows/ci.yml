name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    env:
      # Stub inference: tests don't need torch or the 94 MB checkpoint.
      SKINSENSE_USE_REAL_MODELS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt
      - name: Install dependencies (torch/torchvision skipped)
        run: |
          grep -v -E '^(torch|torchvision)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - name: Lint (reported, not blocking yet)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
